services:
  web:
    build: .
    container_name: clinicdesk-web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: clinicdesk_db
      DB_USER: root
      DB_PASS: rootpass
      BASE_URL: http://localhost:8080
    depends_on:
      - db
  db:
    image: mysql:8.0
    container_name: clinicdesk-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: clinicdesk_db
    volumes:
      - db_data:/var/lib/mysql
      - ./database/clinicdesk_db.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  db_data:
